name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-check:
    name: build & check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint placeholder — eslint config not present yet; tracked as a follow-up
      # to feature 007. Drop a line like `npm run lint` here once it lands.

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test (stdio + http + CLI)
        run: npm run smoke

      - name: Constitution gate — no LLM-provider SDK
        run: node scripts/check-no-llm-sdk.mjs

      - name: Constitution gate — production license allowlist
        run: node scripts/check-licenses.mjs

      - name: Constitution gate — guide drift
        run: node scripts/check-guide-drift.mjs
